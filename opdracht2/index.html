<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/style.css">
  </head>
  <body>
    <section class="container achtergrond-licht">
        <div class="grid">
            <div class="col">Tabel overzicht</div>
            <div class="border rounded overflow-hidden"></div>
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th scope="col">Nummer</th>
                            <th scope="col">Naam</th>
                            <th scope="col">Functie</th>
                            <th scope="col">Link</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td scope="row">1</td>
                            <td>John</td>
                            <td>CEO</td>
                            <td><a href="#container">link</a></td>
                        </tr>
                        <tr>
                            <td scope="row">2</td>
                            <td>Peter</td>
                            <td>CFO</td>
                            <td><a href="#container">link</a></td>
                        </tr>
                        <tr>
                            <td scope="row">3</td>
                            <td>Mark</td>
                            <td>CTO</td>
                            <td><a href="#container">link</a></td>
                        </tr>
                        <tr>
                            <td scope="row">4</td>
                            <td>Hank</td>
                            <td>CDO</td>
                            <td><a href="#container">link</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
    <section class="container achtergrond-donker">
        <div class="row">
            <div class="col"><h2>Titel hier</h2></div>
        </div>
        <div class="row">
            <div class="col-4">hier komt een lijstje</div>
            <div class="col-8">hier komt tekst</div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  </body>
</html>
